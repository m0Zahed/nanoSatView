server.port=8080
server.address=0.0.0.0
spring.config.import=optional:file:.env.local[.properties]
app.kafka.enabled=false
app.kafka.topic.user-created=user-created-topic
app.kafka.topic.diagram-saved=diagram-saved-topic
app.diagram.storage-root=./data/diagrams
app.s3.enabled=${APP_S3_ENABLED:false}
app.s3.bucket=${APP_S3_BUCKET:}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.key-prefix=${APP_S3_KEY_PREFIX:diagrams}
app.s3.endpoint=${APP_S3_ENDPOINT:}
app.s3.path-style-access=${APP_S3_PATH_STYLE_ACCESS:false}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-created-demo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/project-management}
spring.datasource.driver-class-name=${APP_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
