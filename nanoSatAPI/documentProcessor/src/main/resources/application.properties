server.port=8080
server.address=0.0.0.0
app.kafka.enabled=false
app.kafka.topic.user-created=user-created-topic
app.kafka.topic.diagram-saved=diagram-saved-topic
app.diagram.storage-root=./data/diagrams
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-created-demo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/project-management}
spring.datasource.driver-class-name=${APP_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
